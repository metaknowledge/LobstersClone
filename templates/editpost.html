<form
  hx-put="/api/post/{{postid}}"
  hx-ext="json-enc"
  hx-target="this"
  hx-swap="outerHTML"
  style="display: flex; flex-direction:column;">
  <input type="text" name="title" value="{{title}}">
  <textarea type="text" name="content" rows="2" cols ="50">{{content}}</textarea>
  <button type="submit">
    Submit
  </button>
</form>
